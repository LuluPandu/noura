<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noura - Direct Donation Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Noura</h1>
    <p>Verified fundraisers for genuine causes across India</p>
    <nav>
      <a href="index.html">Home</a>
      <a href="submit.html">Raise a Request</a>
      <a href="admin-login.html">Admin Login</a>
    </nav>
  </header>

  <section class="filters">
    <select id="categoryFilter">
      <option value="">All Categories</option>
      <option value="Natural Calamities">Natural Calamities</option>
      <option value="Medical Emergencies">Medical Emergencies</option>
      <option value="Education">Education</option>
      <option value="Animal Welfare">Animal Welfare</option>
      <option value="Disaster Relief NGOs">Disaster Relief NGOs</option>
    </select>

    <select id="regionFilter">
      <option value="">All Regions</option>
      <option value="Kerala">Kerala</option>
      <option value="Maharashtra">Maharashtra</option>
      <option value="Assam">Assam</option>
      <option value="Tamil Nadu">Tamil Nadu</option>
    </select>
  </section>

  <main id="campaignList" class="campaign-grid">
    <!-- Campaign cards will be inserted here by JavaScript -->
    <p id="loadingText">Loading campaigns...</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
