<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raise a Request - Noura</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Noura</h1>
    <p>Verified fundraisers for genuine causes across India</p>
    <nav>
      <a href="index.html">Home</a>
      <a href="submit.html">Raise a Request</a>
      <a href="admin-login.html">Admin Login</a>
    </nav>
  </header>

  <main class="form-container">
    <h2>Submit a Fundraiser Request</h2>
    <p class="form-note">⚠️ For verified official/community causes only — not personal benefit. Every request is manually reviewed before going live.</p>

    <form id="campaignForm">
      <label>Requester Name / Organization</label>
      <input type="text" name="requesterName" required>

      <label>Cause Title</label>
      <input type="text" name="title" required>

      <label>Category</label>
      <select name="category" required>
        <option value="">Select a category</option>
        <option value="Natural Calamities">Natural Calamities</option>
        <option value="Medical Emergencies">Medical Emergencies</option>
        <option value="Education">Education</option>
        <option value="Animal Welfare">Animal Welfare</option>
        <option value="Disaster Relief NGOs">Disaster Relief NGOs</option>
      </select>

      <label>Region / State</label>
      <select name="region" required>
        <option value="">Select a region</option>
        <option value="Kerala">Kerala</option>
        <option value="Maharashtra">Maharashtra</option>
        <option value="Assam">Assam</option>
        <option value="Tamil Nadu">Tamil Nadu</option>
      </select>

      <label>Detailed Description</label>
      <textarea name="description" rows="5" required></textarea>

      <label>Fund Goal Amount (₹)</label>
      <input type="number" name="goalAmount" required>

      <label>Proof Link (news article / govt notification / NGO registration)</label>
      <input type="url" name="proofLink" placeholder="https://...">

      <label>Payment Scanner Image URL</label>
      <input type="url" name="scannerImage" placeholder="https://... (temporary — file upload coming soon)" required>

      <label>Contact Number / Email</label>
      <input type="text" name="contactInfo" required>

      <label class="checkbox-label">
        <input type="checkbox" required>
        I confirm this is for a verified public/community cause, not personal benefit.
      </label>

      <button type="submit">Submit for Review</button>
    </form>

    <p id="formMessage"></p>
  </main>

  <script src="submit.js"></script>
</body>
</html>
